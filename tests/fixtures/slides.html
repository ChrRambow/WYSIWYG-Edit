<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team</title>
<style>
body { margin: 0; font-family: sans-serif; }
.bg-slider { position: fixed; inset: 0; z-index: -1; }
.bg-slider .slide { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity 1s; }
.bg-slider .slide.on { opacity: 1; }
main { max-width: 900px; margin: 40px auto; background: #fff; padding: 20px; }
.carousel { position: relative; }
.carousel-track { display: flex; gap: 12px; overflow-x: auto; }
.carousel-item { flex: 0 0 200px; margin: 0; }
.carousel-item img { width: 100%; height: 160px; object-fit: cover; }
</style>
</head>
<body>
  <div class="bg-slider" data-slides="images/bread.svg, images/cake.svg, images/logo.svg" aria-hidden="true"></div>
  <main>
    <h1>Unser Team</h1>
    <div class="carousel">
      <button class="carousel-btn prev" aria-label="Zurück">‹</button>
      <div class="carousel-track">
          <figure class="carousel-item"><img src="images/bread.svg" alt="Lisa" loading="lazy"><figcaption>Lisa – Empfang</figcaption></figure>
          <figure class="carousel-item"><img src="images/cake.svg" alt="Beate" loading="lazy"><figcaption>Beate – Prophylaxe</figcaption></figure>
          <figure class="carousel-item"><img src="images/logo.svg" alt="Marnie" loading="lazy"><figcaption>Marnie – Labor</figcaption></figure>
      </div>
      <button class="carousel-btn next" aria-label="Weiter">›</button>
    </div>
  </main>
<script>
var slider = document.querySelector('.bg-slider[data-slides]');
slider.getAttribute('data-slides').split(',').forEach(function (url, i) {
  var slide = document.createElement('div');
  slide.className = 'slide' + (i === 0 ? ' on' : '');
  slide.style.backgroundImage = 'url(' + url.trim() + ')';
  slider.appendChild(slide);
});
</script>
</body>
</html>
