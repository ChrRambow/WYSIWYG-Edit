<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praxis Menü</title>
<style>
body { margin: 0; font-family: sans-serif; background: #2a6f73; color: #fff; }
.box { max-width: 900px; margin: 0 auto; padding: 30px; }
.main-menu > ul { list-style: none; margin: 0; padding: 0; display: flex; }
.main-menu > ul > li { position: relative; margin-right: 12px; }
.main-menu a { display: inline-block; color: #fff; text-transform: uppercase; padding: 4px 0; }
.main-menu .sub { list-style: none; margin: 0; padding: 0; position: absolute; top: 100%; left: 0; display: none; background: #134; min-width: 160px; }
.main-menu .has-sub:hover > .sub { display: block; }
.nav-toggle { display: none; }
.accordion { border: 1px solid #fff; max-width: 420px; }
.accordion summary { padding: 12px 16px; cursor: pointer; }
.accordion .panel { padding: 0 16px 12px; }
@media (max-width: 700px) {
  .nav-toggle { display: block; }
  .main-menu { display: none; }
  .main-menu.open { display: block; }
  .main-menu > ul { display: block; }
  .main-menu .sub { display: block; position: static; }
}
</style>
</head>
<body>
<div class="box">
  <header>
    <button class="nav-toggle" aria-expanded="false">Menü</button>
    <nav id="nav" class="main-menu">
      <ul>
        <li class="has-sub"><a href="#">Über uns</a>
          <ul class="sub">
            <li><a href="#">Specials</a></li>
            <li><a href="#">Start</a></li>
          </ul>
        </li>
        <li><a href="#">Praxisräume</a></li>
        <li><a href="#">Leistungen</a></li>
        <li class="has-sub"><a href="#">Team</a>
          <ul class="sub">
            <li><a href="#">Zahnärztinnen</a></li>
            <li><a href="#">Mitarbeiter</a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>
  <main>
    <div class="accordion">
      <details open>
        <summary>Online Anamnese</summary>
        <div class="panel"><p>QR-Code</p></div>
      </details>
      <details>
        <summary>Nachhaltigkeit</summary>
        <div class="panel"><p>Erster Absatz.</p><p>Zweiter Absatz.</p></div>
      </details>
      <details>
        <summary>Prophylaxe</summary>
        <div class="panel"><p>Vorsorge.</p></div>
      </details>
    </div>
  </main>
</div>
<script>
var toggle = document.querySelector('.nav-toggle'), nav = document.getElementById('nav');
toggle.addEventListener('click', function () {
  toggle.setAttribute('aria-expanded', String(nav.classList.toggle('open')));
});
</script>
</body>
</html>
